<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetSphere Pro — Offline</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 20%, #1e293b, #0b1120 70%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 36px 28px;
            backdrop-filter: blur(8px);
        }
        img { width: 72px; height: 72px; margin-bottom: 18px; }
        h1 { font-size: 20px; margin: 0 0 10px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
        button, a {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 10px;
            border: 0;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            color: #06121f;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/assets/icon.svg" alt="NetSphere Pro" />
        <h1>You're offline</h1>
        <p>NetSphere Pro needs a connection to sync workspace data. Cached pages remain available once you go back online.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
